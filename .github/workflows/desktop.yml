name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test:desktop
      - run: npm run build
      - run: npm run pack:desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows install, upgrade, uninstall and data retention
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*-win-x64.exe | Select-Object -First 1).FullName
          ./tools/ci/windows-installer-smoke.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.integrity.json
            release/windows-lifecycle.json
          if-no-files-found: error
